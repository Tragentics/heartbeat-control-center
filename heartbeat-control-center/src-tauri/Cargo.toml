[package]
name = "heartbeat-control-center"
version = "1.0.0"
description = "Tragentics Heartbeat Control Center — local vault + heartbeat engine for registered agents"
authors = ["Tragentics"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "heartbeat_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
